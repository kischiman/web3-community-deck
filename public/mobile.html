<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Companion</title>
<link rel="stylesheet" href="/mobile.css" />
</head>
<body>

<header>
  <h1>Bottlenecks</h1>
  <p id="conn">connecting…</p>
</header>

<form id="capture">
  <input id="entry" type="text" placeholder="What are they stuck on?" autocomplete="off"
         autocapitalize="sentences" enterkeyhint="done" maxlength="240" />
  <button type="submit" aria-label="Add">Add</button>
</form>

<ul id="list"></ul>
<p class="empty" id="empty">Nothing yet. Type what the room says — it appears on the big screen instantly.</p>

<div class="pad">
  <button class="primary" id="generate">Generate solutions</button>
  <p class="status" id="status"></p>
</div>

<nav class="remote">
  <button id="prev" aria-label="Previous slide">←</button>
  <span id="slide-label">Slide 1</span>
  <button id="next" aria-label="Next slide">→</button>
</nav>

<script src="/mobile.js"></script>
</body>
</html>
