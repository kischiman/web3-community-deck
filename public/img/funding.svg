<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Decentralized funding — many contributors into one visible pool">
  <!-- contributors -->
  <g fill="#B03A1A">
    <circle cx="16" cy="20" r="7" /><circle cx="50" cy="14" r="7" /><circle cx="84" cy="20" r="7" />
  </g>
  <!-- traceable flows into the pool -->
  <g fill="none" stroke="#B03A1A" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M18 29 C 24 42, 34 48, 42 52" />
    <path d="M50 23 L50 46" />
    <path d="M82 29 C 76 42, 66 48, 58 52" />
  </g>
  <!-- the pool: open, so what is inside can be seen -->
  <path d="M22 56 H78 L70 88 H30 Z" fill="none" stroke="#17150F" stroke-width="4" stroke-linejoin="round" />
  <rect x="34" y="66" width="32" height="4" rx="2" fill="#17150F" opacity="0.28" />
  <rect x="38" y="75" width="24" height="4" rx="2" fill="#17150F" opacity="0.28" />
</svg>
